name: diffaudit-platform

services:
  platform:
    image: ${DIFFAUDIT_IMAGE:-ghcr.io/deliciousbuding/diffaudit-platform}:${DIFFAUDIT_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${DIFFAUDIT_BUILD_DATE:-unknown}
        VCS_REF: ${DIFFAUDIT_VCS_REF:-unknown}
    env_file:
      - path: ./runtime.env
        required: false
    environment:
      DIFFAUDIT_PUBLIC_DATA_DIR: /app/data/public
    ports:
      - "${DIFFAUDIT_BIND:-127.0.0.1:3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - "${DIFFAUDIT_PUBLIC_SNAPSHOT_DIR:-./snapshots/public}:/app/data/public:ro"
      - platform-data:/app/data

volumes:
  platform-data:
